name: Deploy React Vite app to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install dependencies
        run: pnpm install
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build project
        run: pnpm run build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Verify build output
        run: test -s dist/index.html
      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: ./dist
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify uploaded Pages artifact
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        with:
          script: |
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error('Build job did not return a Pages artifact ID. Re-run all jobs to upload a new artifact.');
            }
            const { data: artifact } = await github.rest.actions.getArtifact({
              ...context.repo,
              artifact_id: artifactId,
            });
            if (artifact.name !== 'github-pages' || artifact.expired || artifact.workflow_run?.id !== context.runId) {
              throw new Error('Pages artifact is missing, expired, or belongs to another workflow run. Re-run all jobs.');
            }
            core.info(`Verified github-pages artifact ${artifact.id} (${artifact.size_in_bytes} bytes).`);
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
